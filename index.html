  <h1>Quantum University</h1>
  <p>這個頁面說明名為 Quantum University 的 LinkedIn 應用程式如何處理資料。此應用程式只供擁有者本人使用。</p>
  <h2>會使用的資料</h2>
  <p>在你於 LinkedIn 按下允許之後，應用程式可以讀取你的顯示名稱與大頭貼，並代你發布 LinkedIn 動態。</p>
  <h2>如何使用</h2>
  <p>這些資料只用來完成你自己要求的發布。不會出售，也不會提供給其他人。</p>
  <h2>如何停止授權</h2>
  <p>到 LinkedIn 的設定與隱私，移除 Quantum University 這個應用程式，授權就會結束。</p>
  <p>聯絡方式：<a href="https://github.com/ViperWick">github.com/ViperWick</a></p>
